<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontak</title>
    <style>
      body {
        background-color: #f0f4f9;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 0;
      }
      #contact {
        padding: 40px 20px;
      }
      .contact-form {
        width: 400px;
        margin: 0 auto;
        padding: 24px;
        border: 1px solid #9fb1c5;
        border-radius: 10px;
        box-sizing: border-box;
        background-color: #ffffff;
      }
      .contact-form h2 {
        text-align: center;
        color: #253b56;
        margin-top: 0;
        margin-bottom: 24px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 6px;
        border: 2px solid #cccccc;
      }
      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        background-color: #e2e9f3;
        border-color: #a0b4cc;
      }
      .btn-submit {
        background-color: #253b56;
        color: #ffffff;
        border-radius: 6px;
        padding: 10px 18px;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }
      .btn-submit:hover {
        background-color: #1a2838;
      }
      footer {
        font-size: 16px;
        text-align: center;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <section id="contact">
      <form class="contact-form" action="">
        <h2>Hubungi Saya</h2>
        <div class="form-group">
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
        </div>
        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea name="pesan" id="pesan"></textarea>
        </div>
        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>
    </section>
    <footer>
      <a href="..\index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
