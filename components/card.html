<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kartu Proyek</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0px;
        background-color: #f0f4f9;
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        width: 320px;
        padding: 20px;
        border: 2px solid #253b56;
        margin: 30px auto;
      }
      .card img {
        width: 100%;
        height: 160px;
        display: block;
        object-fit: cover; /*katanya biar fotonya tak gepeng*/
      }
      .card h3 {
        color: #253b56;
        margin-bottom: 8px;
      }
      .card p {
        font-size: 15px;
        color: #555555;
      }
      .card a {
        font-size: 15px;
        color: #e6953b;
      }
      footer {
        text-align: center;
        margin-top: 15px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="../assets/images/feris wheel.png" alt="Decoration picture" />
        <h3>Website Toko Online</h3>
        <p>
          Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan
          CSS.
        </p>
        <a href="#">Lihat Proyek</a>
      </div>
    </main>
    <footer>
      <a href="..\index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
