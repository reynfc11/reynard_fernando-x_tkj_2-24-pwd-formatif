<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Set</title>
    <style>
      body {
        background-color: #f0f4f9;
        font-family: Arial, Helvetica, sans-serif;
      }
      h2 {
        color: #253b56;
        font-size: 20px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
      }
      .button-group .btn {
        margin-right: 10px;
        margin-bottom: 10px;
      }
      .btn-primary {
        background-color: #253b56;
        color: white;
      }
      .btn-secondary {
        background-color: rgb(220, 228, 236);
      }
      .btn-outline {
        background-color: white;
        border: 2px solid #253b56;
      }
      .btn-send {
        background-color: rgba(230, 149, 59, 1);
        color: white;
      }
      .btn-secondary,
      .btn-outline {
        color: #253b56;
      }
      .btn-primary:hover {
        background-color: #172338;
      }
      .btn-secondary:hover {
        background-color: #bcccdc;
      }
      .btn-outline:hover {
        background-color: #dce4ec;
      }
      .btn-send:hover {
        background-color: #c87528;
      }
      /* izin pak taro spasi di link ke berandanya */
      /* biar rapi sama mirip soal */
      /* kalo dekat agak gimana gitu saya */
      footer {
        margin-top: 15px;
        font-size: 16px;
      }
      /* sekalian jarak ke ujung halamannya */
      body {
        margin-left: 35px;
        margin-top: 35px;
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Navigasi Utama</h2>
      <div class="button-group">
        <a class="btn btn-primary" href="#">Lihat Proyek</a>
        <a class="btn btn-secondary" href="#">Unduh CV</a>
        <a class="btn btn-outline" href="#">Hubungi Saya</a>
        <a class="btn btn-send" href="#">Kirim Pesan</a>
      </div>
      <footer>
        <a href="..\index.html">Kembali ke Beranda</a>
      </footer>
    </main>
  </body>
</html>
